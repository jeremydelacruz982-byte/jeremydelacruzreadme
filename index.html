<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌 Valentine DigiBouquet · NGL style</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #fbe9e7 0%, #ffd9d9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    /* main card */
    .valentine-card {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 245, 240, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 48px 48px 32px 32px;
      box-shadow: 0 25px 40px -12px rgba(160, 60, 60, 0.35), 0 0 0 1px #ffc1c1 inset;
      padding: 2rem 2rem 2.5rem;
      border: 1px solid #ffe0e0;
    }

    h1 {
      font-size: 3rem;
      font-weight: 600;
      color: #a13e3e;
      text-align: center;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 0 #fff2f2;
    }

    h1 span {
      font-size: 2.8rem;
    }

    .subhead {
      text-align: center;
      color: #9e5e5e;
      font-style: italic;
      margin-bottom: 2rem;
      font-size: 1.2rem;
      border-bottom: 2px dashed #f3b6b6;
      padding-bottom: 1rem;
    }

    /* step indicator */
    .steps {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .step-badge {
      background: #fff0f0;
      border-radius: 40px;
      padding: 0.6rem 1.6rem;
      font-weight: 500;
      color: #a14b4b;
      box-shadow: 0 4px 8px rgba(200, 120, 120, 0.1);
      border: 1px solid #ffc9c9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-badge.active {
      background: #d46b6b;
      color: white;
      border-color: #b34e4e;
      box-shadow: 0 8px 14px #f0b6b6;
    }

    .step-badge i {
      font-style: normal;
      font-size: 1.2rem;
    }

    /* main grid */
    .bouquet-builder {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 800px) {
      .bouquet-builder {
        grid-template-columns: 1fr;
      }
    }

    /* flower panel */
    .flower-panel {
      background: #fffbfb;
      border-radius: 32px;
      padding: 1.5rem;
      box-shadow: 0 8px 18px #ffd6d6;
      border: 1px solid #ffd2d2;
    }

    .flower-panel h2 {
      font-size: 1.5rem;
      color: #8f4b4b;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .flower-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.8rem;
      margin-bottom: 1.8rem;
    }

    @media (max-width: 500px) {
      .flower-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .flower-option {
      background: #fff4f4;
      border-radius: 24px;
      padding: 0.7rem 0.2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 2px solid transparent;
      box-shadow: 0 2px 6px #f5cdcd;
      font-size: 1.8rem;
      line-height: 1.2;
    }

    .flower-option span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #7a4a4a;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .flower-option.selected {
      border: 3px solid #c95c5c;
      background: #ffe3e3;
      transform: scale(1.02);
      box-shadow: 0 8px 12px #eeb6b6;
    }

    .flower-option:hover {
      background: #ffe7e7;
    }

    /* selected bouquet preview */
    .bouquet-preview {
      background: #fef5f5;
      border-radius: 28px;
      padding: 1.2rem;
      margin-top: 1rem;
      border: 1px dashed #e7a5a5;
      min-height: 120px;
    }

    .bouquet-preview h3 {
      font-size: 1.1rem;
      color: #a15858;
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    .flower-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .flower-tag {
      background: #fae1e1;
      border-radius: 40px;
      padding: 0.3rem 1rem 0.3rem 0.8rem;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #6b3e3e;
      border: 1px solid #e9bebe;
    }

    .flower-tag button {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #b35e5e;
      font-weight: bold;
      line-height: 1;
      padding: 0 2px;
    }

    .flower-tag button:hover {
      color: #8f2e2e;
    }

    /* letter panel */
    .letter-panel {
      background: #fcf3ea;
      border-radius: 32px;
      padding: 1.5rem;
      box-shadow: 0 8px 18px #e9cfcf;
      border: 1px solid #f3d6c9;
      display: flex;
      flex-direction: column;
    }

    .letter-panel h2 {
      font-size: 1.5rem;
      color: #7b523b;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .letter-paper {
      background: #fdf7f0;
      border-radius: 18px;
      padding: 1.2rem;
      box-shadow: inset 0 0 0 1px #ebd5c4, 0 6px 12px #e6cfbf;
      border-left: 8px solid #b48b6b;
      margin-bottom: 1rem;
      flex: 1;
    }

    .letter-paper textarea {
      width: 100%;
      border: none;
      background: transparent;
      resize: vertical;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #4e3a2b;
      outline: none;
      min-height: 150px;
    }

    .letter-paper textarea::placeholder {
      color: #b99b84;
      font-style: italic;
    }

    .brown-shades {
      display: flex;
      gap: 0.6rem;
      margin: 0.8rem 0 1rem;
      flex-wrap: wrap;
    }

    .shade-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.1s;
    }

    .shade-dot.selected {
      outline: 3px solid #b35e5e;
      outline-offset: 2px;
      transform: scale(1.1);
    }

    /* recipient & ngl style */
    .recipient-area {
      margin-top: 1rem;
    }

    .recipient-area label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #8b5e4b;
      display: block;
      margin-bottom: 0.3rem;
    }

    .recipient-area input {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 40px;
      border: 1px solid #dbb8a4;
      background: #fffaf5;
      font-size: 1rem;
      color: #4d3629;
      outline: none;
      transition: 0.15s;
    }

    .recipient-area input:focus {
      border-color: #b87b5c;
      box-shadow: 0 0 0 3px #f3ddd0;
    }

    /* agreement & generate */
    .agreement {
      background: #f9ede4;
      border-radius: 24px;
      padding: 1rem 1.5rem;
      margin: 1.8rem 0 1.2rem;
      font-size: 0.85rem;
      color: #6f4e3c;
      border: 1px solid #e6cfbe;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .agreement input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #b35e5e;
      cursor: pointer;
    }

    .agreement label {
      flex: 1;
      cursor: pointer;
    }

    .generate-btn {
      background: #b35e5e;
      border: none;
      padding: 1.2rem 2rem;
      border-radius: 60px;
      font-size: 1.3rem;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 12px 20px -6px #c98282;
      transition: all 0.15s;
      width: 100%;
      letter-spacing: 0.5px;
      border: 1px solid #a14b4b;
    }

    .generate-btn:hover {
      background: #9e4b4b;
      box-shadow: 0 16px 24px -8px #b36b6b;
      transform: scale(1.01);
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .generate-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.4);
    }

    /* generated link box */
    .link-box {
      background: #fff4ea;
      border-radius: 28px;
      padding: 1.5rem;
      margin-top: 2rem;
      border: 2px solid #eccfbf;
      text-align: center;
      display: none;
    }

    .link-box.visible {
      display: block;
    }

    .link-box p {
      color: #7a523b;
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    .link-box .share-link {
      background: #fff;
      border-radius: 60px;
      padding: 0.9rem 1.2rem;
      font-size: 0.95rem;
      word-break: break-all;
      border: 1px solid #dbb8a4;
      color: #5d3f2e;
      margin-bottom: 1rem;
      font-family: monospace;
    }

    .copy-btn {
      background: #d9b8a6;
      border: none;
      padding: 0.7rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      color: #4d2e1e;
      cursor: pointer;
      transition: 0.1s;
      font-size: 0.95rem;
      margin-right: 0.5rem;
    }

    .copy-btn:hover {
      background: #c9a48e;
    }

    .confidential-note {
      font-size: 0.8rem;
      color: #9e7b68;
      margin-top: 0.8rem;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #b28b7a;
    }

    /* ngl style badge */
    .ngl-badge {
      background: #f5d7d7;
      border-radius: 30px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #a14b4b;
      display: inline-block;
      margin-left: 8px;
    }

    .error-msg {
      color: #c0392b;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="valentine-card">
    <h1>
      <span>💐</span> DigiBouquet <span>💌</span>
    </h1>
    <div class="subhead">
      Valentine’s edition · ngl-style anonymous response · confidential
    </div>

    <!-- Step by step visual -->
    <div class="steps">
      <div class="step-badge active"><i>1</i> Pick flowers</div>
      <div class="step-badge"><i>2</i> Write letter</div>
      <div class="step-badge"><i>3</i> Name recipient</div>
      <div class="step-badge"><i>4</i> Get link</div>
    </div>

    <!-- Main builder -->
    <div class="bouquet-builder">
      <!-- LEFT: FLOWER SELECTION -->
      <div class="flower-panel">
        <h2>🌸 Choose up to 10 flowers</h2>
        <div class="flower-grid" id="flowerGrid">
          <!-- 10 flowers, each with emoji and name -->
          <div class="flower-option" data-flower="daisy" data-emoji="🌼">🌼<span>Daisy</span></div>
          <div class="flower-option" data-flower="lilac" data-emoji="💜">💜<span>Lilac</span></div>
          <div class="flower-option" data-flower="sunflower" data-emoji="🌻">🌻<span>Sunflower</span></div>
          <div class="flower-option" data-flower="peony" data-emoji="🌸">🌸<span>Peony</span></div>
          <div class="flower-option" data-flower="carnation" data-emoji="🌺">🌺<span>Carnation</span></div>
          <div class="flower-option" data-flower="rose" data-emoji="🌹">🌹<span>Rose</span></div>
          <div class="flower-option" data-flower="tulip" data-emoji="🌷">🌷<span>Tulip</span></div>
          <div class="flower-option" data-flower="lavender" data-emoji="🪻">🪻<span>Lavender</span></div>
          <div class="flower-option" data-flower="orchid" data-emoji="🌺">🌺<span>Orchid</span></div>
          <div class="flower-option" data-flower="dahlia" data-emoji="🌼">🌼<span>Dahlia</span></div>
        </div>

        <!-- Selected bouquet preview -->
        <div class="bouquet-preview">
          <h3>Your bouquet <span style="font-weight:400; font-size:0.9rem;">(click ✕ to remove)</span></h3>
          <div class="flower-tags" id="flower
